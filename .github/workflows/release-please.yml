name: ( Release ) Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      publish_matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      - name: Build publish matrix
        id: matrix
        env:
          RELEASE_OUTPUTS: ${{ toJson(steps.release.outputs) }}
        run: |
          MATRIX=$(echo "$RELEASE_OUTPUTS" | jq -c '
            [ to_entries[]
              | select(.key | endswith("--tag_name"))
              | { module: (.key | rtrimstr("--tag_name")), tag: .value }
            ]')
          echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT

      - name: Release Summary
        if: steps.matrix.outputs.matrix != '[]'
        env:
          MATRIX: ${{ steps.matrix.outputs.matrix }}
        run: |
          {
            echo "## 🎉 새로운 Release 생성 완료"
            echo ""
            echo "| 모듈 | 태그 |"
            echo "| --- | --- |"
            echo "$MATRIX" | jq -r '.[] | "| \(.module) | `\(.tag)` |"'
            echo ""
            echo "- **시간**: $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M:%S KST')"
            echo ""
          } >> $GITHUB_STEP_SUMMARY

      - name: PR Summary
        if: steps.release.outputs.prs_created == 'true'
        env:
          PRS: ${{ steps.release.outputs.prs }}
        run: |
          {
            echo "## 📝 Release PR 업데이트됨"
            echo ""
            echo "Conventional Commits 기반으로 모듈별 Release PR이 갱신되었습니다."
            echo "PR을 머지하면 해당 모듈의 태그/Release가 생성됩니다."
            echo ""
            echo "$PRS" | jq -r '.[] | "- #\(.number) \(.title)"'
            echo ""
          } >> $GITHUB_STEP_SUMMARY

      - name: No-op Summary
        if: steps.matrix.outputs.matrix == '[]' && steps.release.outputs.prs_created != 'true'
        run: |
          {
            echo "## ℹ️ release-please 변경 사항 없음"
            echo ""
            echo "릴리스 대상 commit이 없거나, 이미 최신 상태입니다."
            echo "- main HEAD: \`${{ github.sha }}\`"
            echo "- 이벤트: \`${{ github.event_name }}\`"
            echo ""
          } >> $GITHUB_STEP_SUMMARY

  publish:
    needs: release-please
    if: needs.release-please.outputs.publish_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.release-please.outputs.publish_matrix) }}
    uses: ./.github/workflows/publish.yml
    with:
      module: ${{ matrix.module }}
      tag: ${{ matrix.tag }}
    permissions:
      contents: read
      packages: write
    secrets: inherit

  label-published:
    needs: [release-please, publish]
    if: needs.release-please.outputs.publish_matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: "Add autorelease: published label to release PR"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          PR_NUMBER=$(gh api "/repos/${REPO}/commits/${SHA}/pulls" --jq '.[0].number')
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "::warning::No PR found for commit ${SHA}"
            exit 0
          fi
          gh label create "autorelease: published" \
            --color "0E8A16" \
            --description "Release auto-published" \
            --repo "${REPO}" 2>/dev/null || true
          gh pr edit "$PR_NUMBER" --add-label "autorelease: published" --repo "${REPO}"
          {
            echo "## 🏷️ Release PR 라벨 추가됨"
            echo ""
            echo "- **PR**: #${PR_NUMBER}"
            echo "- **라벨**: \`autorelease: published\`"
            echo ""
          } >> $GITHUB_STEP_SUMMARY
