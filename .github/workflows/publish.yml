name: ( Publish ) Publish Libraries

on:
  workflow_call:
    inputs:
      module:
        description: "module (ex. sample-domain)"
        required: true
        type: string
      tag:
        description: "tag (ex. sample-domain-v1.0.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      module:
        description: "module (ex. sample-domain)"
        required: true
        type: string
      tag:
        description: "tag (ex. sample-domain-v1.0.0)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 8

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Publish Library to GitHub Packages
        env:
          GPR_USER: x-access-token
          GPR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :${{ inputs.module }}:publish

      - name: Create Release Summary
        if: success()
        run: |
          VERSION=$(grep -E '^\s*version\s*=' "${{ inputs.module }}/gradle.properties" | sed -E 's/^\s*version\s*=\s*//' | tr -d ' ')
          {
            echo "## 라이브러리 배포 완료 🚀"
            echo ""
            echo "- **모듈**: \`${{ inputs.module }}\`"
            echo "- **태그**: \`${{ inputs.tag }}\`"
            echo "- **버전**: \`${VERSION}\`"
            echo "- **배포자**: ${{ github.actor }}"
            echo "- **시간**: $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M:%S KST')"
            echo "- **커밋**: ${{ github.sha }}"
          } >> $GITHUB_STEP_SUMMARY
